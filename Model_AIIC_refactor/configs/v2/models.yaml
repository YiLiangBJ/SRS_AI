models:
  full_mlp_default:
    type: full_mlp
    params:
      normalize_energy: true
      hidden_dim: 128
      mlp_depth: 3

  full_mlp_arch_search:
    type: full_mlp
    params:
      normalize_energy: true
      hidden_dim: 128
      mlp_depth: 3
    sweeps:
      - target: params.hidden_dim
        alias: hd
        values: [64, 128, 256]
      - target: params.mlp_depth
        alias: depth
        values: [2, 3, 4]

  full_mlp_capacity_search:
    type: full_mlp
    params:
      normalize_energy: true
      hidden_dim: 128
      mlp_depth: 3
    sweeps:
      - target: params.hidden_dim
        alias: hd
        values: [32, 64, 128, 256, 512]
      - target: params.mlp_depth
        alias: depth
        values: [2, 3, 4, 5]

  separator1_small:
    type: separator1
    params:
      normalize_energy: true
      hidden_dim: 32
      num_stages: 2
      mlp_depth: 3
      share_weights_across_stages: false
      use_hidden_layer_norm: false
      use_hidden_relu: true

  separator1_default:
    type: separator1
    params:
      normalize_energy: true
      hidden_dim: 64
      num_stages: 3
      mlp_depth: 3
      share_weights_across_stages: false
      use_hidden_layer_norm: false
      use_hidden_relu: true

  separator2_default:
    type: separator2
    params:
      normalize_energy: true
      hidden_dim: 64
      num_stages: 3
      mlp_depth: 3
      share_weights_across_stages: false
      activation_type: relu
      onnx_mode: false

  separator1_grid_search_6ports:
    type: separator1
    params:
      normalize_energy: true
      mlp_depth: 3
      num_stages: 2
      share_weights_across_stages: false
      use_hidden_layer_norm: false
      use_hidden_relu: true
    sweeps:
      - target: params.hidden_dim
        alias: hd
        values: [16, 32, 64, 128]