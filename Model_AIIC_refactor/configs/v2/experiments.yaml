experiments:
  quick_full_mlp_v2:
    description: Quick 6-port smoke test for the joint full-MLP baseline.
    task: channel_separator_6port_quick
    model: full_mlp_default
    training_strategy: quick_supervised

  quick_full_mlp_masked_v2:
    description: Quick 6-port smoke test for the joint full-MLP baseline with masked residual correction.
    task: channel_separator_6port_quick
    model: full_mlp_default_masked
    training_strategy: quick_supervised

  quick_full_mlp_learned_dense_v2:
    description: Quick 6-port smoke test for the joint full-MLP baseline with learned dense residual correction.
    task: channel_separator_6port_quick
    model: full_mlp_default_learned_dense
    training_strategy: quick_supervised

  full_mlp_nmse_v2:
    description: Train the joint 6-port full-MLP baseline with plain NMSE loss.
    task: channel_separator_6port_standard
    model: full_mlp_default
    training_strategy: supervised_nmse_plateau

  full_mlp_arch_search_v2:
    description: Sweep hidden_dim and mlp_depth for the joint 6-port full-MLP baseline under NMSE training.
    task: channel_separator_6port_standard
    model: full_mlp_arch_search
    training_strategy: supervised_nmse_plateau

  full_mlp_capacity_search_v2:
    description: Default 6-port hidden_dim and mlp_depth sweep for the joint full-MLP baseline under NMSE training.
    task: channel_separator_6port_standard
    model: full_mlp_capacity_search
    training_strategy: supervised_nmse_plateau

  full_mlp_capacity_search_masked_v2:
    description: Default 6-port hidden_dim and mlp_depth sweep for the joint full-MLP baseline with masked residual correction.
    task: channel_separator_6port_standard
    model: full_mlp_capacity_search_masked
    training_strategy: supervised_nmse_plateau

  full_mlp_capacity_search_learned_dense_v2:
    description: Default 6-port hidden_dim and mlp_depth sweep for the joint full-MLP baseline with learned dense residual correction.
    task: channel_separator_6port_standard
    model: full_mlp_capacity_search_learned_dense
    training_strategy: supervised_nmse_plateau

  quick_full_mlp_two_stage_v2:
    description: Quick 6-port two-stage training smoke test for the joint full-MLP baseline.
    task: channel_separator_6port_quick
    model: full_mlp_default
    training_strategy: quick_two_stage_supervised

  quick_full_mlp_three_stage_v2:
    description: Quick 6-port three-stage training smoke test for the joint full-MLP baseline using nmse -> log -> weighted stages.
    task: channel_separator_6port_quick
    model: full_mlp_default
    training_strategy: quick_three_stage_supervised

  quick_separator1_v2:
    description: Quick 6-port smoke test for separator1.
    task: channel_separator_6port_quick
    model: separator1_small
    training_strategy: quick_supervised

  quick_separator1_masked_v2:
    description: Quick 6-port smoke test for separator1 with masked residual correction.
    task: channel_separator_6port_quick
    model: separator1_small_masked
    training_strategy: quick_supervised

  quick_separator1_learned_dense_v2:
    description: Quick 6-port smoke test for separator1 with learned dense residual correction.
    task: channel_separator_6port_quick
    model: separator1_small_learned_dense
    training_strategy: quick_supervised

  quick_separator3_v2:
    description: Quick 6-port smoke test for multi-stage separator3 with learned dense residual correction.
    task: channel_separator_6port_quick
    model: separator3_default
    training_strategy: quick_supervised

  default_6port_separator1_v2:
    description: Default 6-port separator1 sweep over hidden_dim, depth, stage count, and weight sharing using the component-based schema.
    task: channel_separator_6port_standard
    model: separator1_grid_search_6ports
    training_strategy: supervised_nmse_plateau

  default_6port_separator1_masked_v2:
    description: Default 6-port separator1 sweep with masked residual correction over hidden_dim, depth, stage count, and weight sharing.
    task: channel_separator_6port_standard
    model: separator1_grid_search_6ports_masked
    training_strategy: supervised_nmse_plateau

  default_6port_separator1_learned_dense_v2:
    description: Default 6-port separator1 sweep with learned dense residual correction over hidden_dim, depth, stage count, and weight sharing.
    task: channel_separator_6port_standard
    model: separator1_grid_search_6ports_learned_dense
    training_strategy: supervised_nmse_plateau

  default_6port_separator3_v2:
    description: Default 6-port multi-stage separator3 training run with learned dense residual correction.
    task: channel_separator_6port_standard
    model: separator3_default
    training_strategy: supervised_nmse_plateau
  default_6port_separator3_learned_dense_v2:
    description: Default 6-port multi-stage separator3 sweep over hidden_dim with learned dense residual correction.
    task: channel_separator_6port_standard
    model: separator3_grid_search_6ports_learned_dense
    training_strategy: supervised_nmse_plateau

  quick_separator3_stage_templates_v1:
    description: Quick 6-port smoke test for hand-designed multi-stage separator3 stage-hidden templates.
    task: channel_separator_6port_quick
    model:
      - separator3_template_128_64_learned_dense
      - separator3_template_128_64_64_learned_dense
      - separator3_template_128_128_64_learned_dense
      - separator3_template_64_64_64_learned_dense
    training_strategy: quick_supervised

  separator3_stage_templates_learned_dense_v1:
    description: Standard 6-port comparison of hand-designed multi-stage separator3 stage-hidden templates.
    task: channel_separator_6port_standard
    model:
      - separator3_template_128_64_learned_dense
      - separator3_template_128_64_64_learned_dense
      - separator3_template_128_128_64_learned_dense
      - separator3_template_64_64_64_learned_dense
    training_strategy: supervised_nmse_plateau

  compare_default_models_v2:
    description: Compare the default full_mlp, separator1, and separator2 models under the same 6-port task and training strategy.
    task: channel_separator_6port_standard
    model: [full_mlp_default, separator1_default, separator2_default]
    training_strategy: supervised_log_plateau

  separator1_loss_search_v2:
    description: Compare different supervised losses for 6-port separator1_default using the component-based schema.
    task: channel_separator_6port_standard
    model: separator1_default
    training_strategy: loss_sweep_supervised